[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "automaster-audit"
version = "0.33.0"
description = "Auditor de workflows GHL extraídos pelo Automaster v2"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
automaster-audit = "automaster_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/automaster_audit"]
# lido em tempo de execução (schema pelo loader): vai no wheel
artifacts = ["src/automaster_audit/dump_schema.json"]

[tool.ruff]
# 120 e não o padrão 88: o código escreve longo de propósito (descrições de tool,
# literais de HTML). Com 88, 1210 linhas seriam quebradas; com 120, 60.
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
