[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "automaster-audit"
version = "0.1.0"
description = "Auditor de workflows GHL extraídos pelo Automaster v2"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
automaster-audit = "automaster_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/automaster_audit"]
# o schema do dump é lido em tempo de execução pelo loader: vai no wheel
artifacts = ["src/automaster_audit/dump_schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
